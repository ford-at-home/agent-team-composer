name: Build Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run TypeScript type checking
      run: npm run typecheck
    
    - name: Build package
      run: npm run build:npm
    
    - name: Validate build output
      run: node scripts/validate-build.js
    
    - name: Test CLI execution
      run: |
        node bin/agent-team-composer.js --version
        node bin/agent-team-composer.js --help
    
    - name: Test package imports
      run: |
        # Create a test file that imports the package
        echo "import { LLMOrchestrator } from './dist/index.js';" > test-import.mjs
        echo "console.log('Import test passed');" >> test-import.mjs
        node test-import.mjs
        rm test-import.mjs
    
    - name: Run unit tests
      run: npm run test:once
    
    - name: Check for untracked files
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Build process created untracked files:"
          git status --porcelain
          exit 1
        fi