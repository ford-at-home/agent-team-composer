name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: true # Don't fail on lint warnings

      - name: Run type checking
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:once

      - name: Build package
        run: npm run build:npm

      - name: Validate build
        run: npm run validate:build

      - name: Run build integration tests
        run: npm run test:build

      - name: Test CLI execution
        run: |
          node bin/agent-team-composer.js --version
          node bin/agent-team-composer.js --help
          npx . --version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '18.x'
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Build process created uncommitted changes"
            git status --porcelain
            exit 1
          fi
