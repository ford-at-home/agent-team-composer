name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Create release branch
      run: |
        BRANCH_NAME="release/v$(npm version ${{ github.event.inputs.version }} --no-git-tag-version --no-commit-hooks | sed 's/v//')"
        git checkout -b $BRANCH_NAME
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
        echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
    
    - name: Update CHANGELOG
      run: |
        cat > CHANGELOG_NEW.md << EOF
        # Changelog
        
        ## [v${{ env.NEW_VERSION }}] - $(date +%Y-%m-%d)
        
        ### Added
        - _List new features here_
        
        ### Changed
        - _List changes here_
        
        ### Fixed
        - _List bug fixes here_
        
        ### Dependencies
        - _List dependency updates here_
        
        ---
        
        EOF
        
        if [ -f CHANGELOG.md ]; then
          tail -n +2 CHANGELOG.md >> CHANGELOG_NEW.md
          mv CHANGELOG_NEW.md CHANGELOG.md
        else
          mv CHANGELOG_NEW.md CHANGELOG.md
        fi
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: |
        npm run typecheck
        npm run test:once
    
    - name: Build and validate
      run: |
        npm run build:npm
        npm run validate:build
    
    - name: Commit changes
      run: |
        git add package.json package-lock.json CHANGELOG.md
        git commit -m "chore: prepare release v${{ env.NEW_VERSION }}"
    
    - name: Push release branch
      run: git push origin ${{ env.BRANCH_NAME }}
    
    - name: Create Pull Request
      uses: actions/github-script@v7
      with:
        script: |
          const { data: pr } = await github.rest.pulls.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Release v${{ env.NEW_VERSION }}`,
            head: `${{ env.BRANCH_NAME }}`,
            base: 'main',
            body: `## 🚀 Release v${{ env.NEW_VERSION }}
            
            This PR was automatically created to prepare the release of version ${{ env.NEW_VERSION }}.
            
            ### Checklist
            - [ ] Review and update CHANGELOG.md with actual changes
            - [ ] Run \`npm run build:npm\` locally and test the package
            - [ ] Verify all tests pass
            - [ ] Review package contents with \`npm pack --dry-run\`
            
            ### What happens after merge?
            1. Create and push a tag: \`git tag v${{ env.NEW_VERSION }} && git push origin v${{ env.NEW_VERSION }}\`
            2. The publish workflow will automatically trigger and publish to NPM
            
            Or use the manual publish workflow with the "Publish to NPM" action.
            
            ---
            
            Version bump: ${{ github.event.inputs.version }}
            `
          });
          
          // Add labels
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr.number,
            labels: ['release', 'automated']
          });