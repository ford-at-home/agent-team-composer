name: Setup Labels

on:
  workflow_dispatch:

jobs:
  setup-labels:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create labels
      uses: actions/github-script@v7
      with:
        script: |
          const labels = [
            { name: 'breaking-change', color: 'D73A4A', description: 'Breaking changes that require major version bump' },
            { name: 'feature', color: '0075CA', description: 'New feature that requires minor version bump' },
            { name: 'minor', color: '0075CA', description: 'Minor version bump' },
            { name: 'major', color: 'D73A4A', description: 'Major version bump' },
            { name: 'skip-release', color: 'CCCCCC', description: 'Skip automatic release for this PR' },
            { name: 'bug', color: 'D73A4A', description: 'Something isn\'t working' },
            { name: 'documentation', color: '0075CA', description: 'Improvements or additions to documentation' },
            { name: 'dependencies', color: '0366D6', description: 'Pull requests that update a dependency file' },
            { name: 'automated', color: '0E8A16', description: 'Automated PR from GitHub Actions' },
            { name: 'release', color: '00FF00', description: 'Release-related PR' }
          ];
          
          for (const label of labels) {
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ...label
              });
              console.log(`Created label: ${label.name}`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`Label already exists: ${label.name}`);
                // Try to update it
                try {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ...label
                  });
                  console.log(`Updated label: ${label.name}`);
                } catch (updateError) {
                  console.error(`Failed to update label ${label.name}:`, updateError);
                }
              } else {
                console.error(`Failed to create label ${label.name}:`, error);
              }
            }
          }