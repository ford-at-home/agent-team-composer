[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-backlog-generator"
version = "1.0.0"
authors = [
    {name = "William Prior", email = "your.email@example.com"},  # TODO: Replace with your email
]
description = "CLI tool to transform GitHub repo READMEs into ordered project backlogs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
keywords = ["github", "backlog", "project-management", "cli", "developer-tools"]
dependencies = [
    "anthropic>=0.20.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "PyGithub>=2.1.1",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/github-backlog-generator"
"Bug Tracker" = "https://github.com/yourusername/github-backlog-generator/issues"
Repository = "https://github.com/yourusername/github-backlog-generator"
Documentation = "https://github.com/yourusername/github-backlog-generator#readme"

[project.scripts]
github-backlog = "github_backlog_generator.cli:main"
github-backlog-generator = "github_backlog_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["github_backlog_generator*"]
exclude = ["tests*"]